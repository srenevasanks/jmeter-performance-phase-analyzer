name: macOS published v1.0.0 JAR validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  released-jar:
    runs-on: macos-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Download official distributions and verify checksums
        env:
          RELEASE: https://github.com/srenevasanks/jmeter-performance-phase-analyzer/releases/download/v1.0.0
        run: |
          set -euo pipefail
          mkdir -p evidence downloads
          { sw_vers; uname -m; java -version; } > evidence/environment.txt 2>&1
          curl -fL --retry 3 "$RELEASE/jmeter-performance-phase-analyzer-1.0.0.jar" -o downloads/jmeter-performance-phase-analyzer-1.0.0.jar
          curl -fL --retry 3 "$RELEASE/SHA256SUMS.txt" -o downloads/SHA256SUMS.txt
          python3 - <<'PY' | tee evidence/release-checksum.txt
          import hashlib
          from pathlib import Path
          expected, name = Path('downloads/SHA256SUMS.txt').read_text().split()
          assert name == 'jmeter-performance-phase-analyzer-1.0.0.jar'
          actual = hashlib.sha256(Path('downloads', name).read_bytes()).hexdigest()
          assert actual == expected.lower(), 'Published SHA-256 mismatch'
          print(name, actual, 'OK (published checksum; CRLF-safe parsing)')
          PY
          URL=https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          curl -fL --retry 3 "$URL" -o downloads/apache-jmeter-5.6.3.tgz
          curl -fL --retry 3 "$URL.sha512" -o downloads/apache-jmeter-5.6.3.tgz.sha512
          python3 - <<'PY'
          import hashlib, re
          from pathlib import Path
          expected = re.search(r'\b[0-9a-fA-F]{128}\b', Path('downloads/apache-jmeter-5.6.3.tgz.sha512').read_text()).group().lower()
          assert hashlib.sha512(Path('downloads/apache-jmeter-5.6.3.tgz').read_bytes()).hexdigest() == expected
          PY
          tar -xzf downloads/apache-jmeter-5.6.3.tgz -C "$RUNNER_TEMP"
          echo "JMETER_HOME=$RUNNER_TEMP/apache-jmeter-5.6.3" >> "$GITHUB_ENV"
          cp downloads/jmeter-performance-phase-analyzer-1.0.0.jar "$RUNNER_TEMP/apache-jmeter-5.6.3/lib/ext/"
          cmp downloads/jmeter-performance-phase-analyzer-1.0.0.jar "$RUNNER_TEMP/apache-jmeter-5.6.3/lib/ext/jmeter-performance-phase-analyzer-1.0.0.jar"
      - name: Execute one 40-second local HTTP workload using released listener
        run: |
          set -euo pipefail
          "$JMETER_HOME/bin/jmeter" -v >> evidence/environment.txt 2>&1
          python3 .github/validation/macos_release.py prepare
          python3 .github/validation/macos_release.py serve > evidence/mock.log 2>&1 &
          MOCK_PID=$!
          trap 'kill "$MOCK_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:18911/ok >/dev/null; then break; fi
            sleep 1
          done
          "$JMETER_HOME/bin/jmeter" -n -t evidence/macOS_Release_Validation.jmx -l evidence/results.jtl -j evidence/jmeter.log \
            -Jjmeter.save.saveservice.sent_bytes=true -Jjmeter.save.saveservice.assertion_results_failure_message=true \
            > evidence/jmeter-console.log 2>&1
      - name: Export Excel through the released reporting API and reconcile actual JTL
        run: |
          set -euo pipefail
          CP="$JMETER_HOME/lib/*:$JMETER_HOME/lib/ext/*"
          mkdir -p "$RUNNER_TEMP/release-export-fixture"
          # Compile only this tiny API caller, never plugin sources or the plugin JAR.
          javac -cp "$CP" -d "$RUNNER_TEMP/release-export-fixture" .github/validation/ReleasedJarExports.java
          java -Djava.awt.headless=true -cp "$RUNNER_TEMP/release-export-fixture:$CP" ReleasedJarExports evidence/reports > evidence/plugin-loading.txt 2>&1
          python3 .github/validation/macos_release.py validate
      - name: Record failure summary if execution did not reach validation
        if: always()
        env:
          WORKFLOW_STATUS: ${{ job.status }}
        run: |
          mkdir -p evidence
          if [ ! -f evidence/validation-summary.json ]; then
            python3 - <<'PY'
          import json, os, platform
          from pathlib import Path
          Path('evidence/validation-summary.json').write_text(json.dumps({'result':'FAIL','workflowStatus':os.environ['WORKFLOW_STATUS'],'platform':platform.platform(),'error':'Workflow stopped before metric validation. See step logs; exports NOT TESTED.'},indent=2))
          PY
          fi
      - name: Upload actual execution evidence, including on failure
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: macos-official-v1.0.0-validation
          path: evidence/
          if-no-files-found: error
          retention-days: 30
